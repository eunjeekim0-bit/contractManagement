{% extends 'base.html' %}

{% block title %}권한 관리{% endblock %}

{% block page_title %}권한 관리{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-5">
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">역할 목록</h6>
        <ul id="roleList" class="list-group"></ul>
        <div class="mt-3 d-flex">
          <input id="newRoleInput" class="form-control me-2" placeholder="새 역할 id (예: manager)">
          <input id="newRoleLabel" class="form-control me-2" placeholder="표시명">
          <button id="addRoleBtn" class="btn btn-primary">추가</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">사용자 검색 / 권한 부여</h6>
        <div class="input-group mb-2">
          <input id="userSearch" class="form-control" placeholder="사용자 이름 또는 ID 검색">
          <button id="searchUserBtn" class="btn btn-outline-secondary">검색</button>
        </div>
        <ul id="userSearchResults" class="list-group"></ul>
      </div>
    </div>
  </div>
  <div class="col-md-7">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">선택된 역할의 페이지 접근 설정</h6>
        <div id="pagesCheckboxes" class="mb-3"></div>
        <button id="saveRolePages" class="btn btn-success">저장</button>
      </div>
    </div>
    <div class="card mt-3">
      <div class="card-body">
        <h6 class="card-title">선택된 역할의 사용자</h6>
        <ul id="roleUsers" class="list-group"></ul>
      </div>
    </div>
  </div>
</div>

<script>
let navPages = {{ nav_pages|tojson }};
let selectedRoleId = null;

function renderRoles(roles) {
  const ul = document.getElementById('roleList'); ul.innerHTML='';
  roles.forEach(r=>{
    const li=document.createElement('li'); li.className='list-group-item d-flex justify-content-between align-items-center';
    li.innerHTML = `<div><strong>${r.label}</strong> <small class="text-muted">(${r.id})</small></div>`;
    li.addEventListener('click', ()=>selectRole(r.id));
    const del=document.createElement('button'); del.className='btn btn-sm btn-outline-danger'; del.textContent='삭제';
    del.addEventListener('click',(e)=>{e.stopPropagation(); deleteRole(r.id)});
    li.appendChild(del);
    ul.appendChild(li);
  });
}

function selectRole(id){
  selectedRoleId = id; loadPermissions();
}

async function loadPermissions(){
  const res = await fetch('/api/permissions');
  const data = await res.json();
  renderRoles(data.roles);
  if(!selectedRoleId && data.roles.length) selectedRoleId = data.roles[0].id;
  renderRoleDetails(data);
}

function renderRoleDetails(data){
  const role = data.roles.find(r=>r.id===selectedRoleId);
  const pagesDiv = document.getElementById('pagesCheckboxes'); pagesDiv.innerHTML='';
  if(!role){ pagesDiv.innerHTML='<div class="text-muted">역할 선택하세요</div>'; return }
  navPages.forEach(p=>{
    const id = `chk_${p.key}`;
    const cb = document.createElement('div'); cb.className='form-check';
    cb.innerHTML = `<input class="form-check-input" type="checkbox" id="${id}" ${role.pages.includes(p.key)?'checked':''}>
      <label class="form-check-label" for="${id}">${p.label} (${p.key})</label>`;
    pagesDiv.appendChild(cb);
  });
  // role users
  const urs = data.user_roles.filter(u=>u.roles && u.roles.includes(role.id));
  const ul = document.getElementById('roleUsers'); ul.innerHTML='';
  urs.forEach(u=>{
    const li=document.createElement('li'); li.className='list-group-item d-flex justify-content-between align-items-center';
    li.textContent = `${u.user_id} (${u.name||''})`;
    const btn = document.createElement('button'); btn.className='btn btn-sm btn-outline-danger'; btn.textContent='권한 제거';
    btn.addEventListener('click', ()=>removeUserRole(u.user_id, role.id));
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

async function saveRolePages(){
  if(!selectedRoleId) return alert('역할 선택');
  const boxes = document.querySelectorAll('#pagesCheckboxes input[type=checkbox]');
  const pages = Array.from(boxes).filter(c=>c.checked).map(c=>c.id.replace('chk_',''));
  const res = await fetch(`/api/permissions/roles/${selectedRoleId}`, {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify({pages})});
  if(res.ok) loadPermissions(); else alert('저장 실패');
}

async function deleteRole(id){
  if(!confirm('삭제하시겠습니까?')) return;
  const res = await fetch(`/api/permissions/roles/${id}`, {method:'DELETE'});
  if(res.ok){ selectedRoleId=null; loadPermissions(); } else alert('실패');
}

async function addRole(){
  const id=document.getElementById('newRoleInput').value.trim();
  const label=document.getElementById('newRoleLabel').value.trim()||id;
  if(!id) return alert('id 입력');
  const res = await fetch('/api/permissions/roles', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({id,label,pages:[]})});
  if(res.ok){ document.getElementById('newRoleInput').value=''; document.getElementById('newRoleLabel').value=''; loadPermissions(); } else { alert('실패') }
}

async function searchUser(){
  const q = document.getElementById('userSearch').value.trim();
  if(!q) return;
  const res = await fetch('/api/users/search?q='+encodeURIComponent(q));
  const data = await res.json();
  const ul = document.getElementById('userSearchResults'); ul.innerHTML='';
  data.results.forEach(u=>{
    const li=document.createElement('li'); li.className='list-group-item d-flex justify-content-between align-items-center';
    li.textContent = `${u.id} - ${u.name}`;
    const addBtn = document.createElement('button'); addBtn.className='btn btn-sm btn-primary'; addBtn.textContent='부여';
    addBtn.addEventListener('click', ()=>assignRole(u.id));
    li.appendChild(addBtn);
    ul.appendChild(li);
  });
}

async function assignRole(userId){
  if(!selectedRoleId) return alert('역할 선택');
  const res = await fetch(`/api/users/${userId}/roles`, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({role:selectedRoleId})});
  if(res.ok) loadPermissions(); else alert('실패');
}

async function removeUserRole(userId, roleId){
  if(!confirm('권한을 제거하시겠습니까?')) return;
  const res = await fetch(`/api/users/${userId}/roles/${roleId}`, {method:'DELETE'});
  if(res.ok) loadPermissions(); else alert('실패');
}

document.getElementById('addRoleBtn').addEventListener('click', addRole);
document.getElementById('saveRolePages').addEventListener('click', saveRolePages);
document.getElementById('searchUserBtn').addEventListener('click', searchUser);

loadPermissions();
</script>

{% endblock %}
