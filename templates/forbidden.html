<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>접근 제한 - 계약서 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.forbidden-card { background: #fff; border-radius: 16px; padding: 48px; max-width: 420px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
.forbidden-card i { font-size: 2.6rem; color: #ef476f; }
.forbidden-card h4 { margin: 16px 0 8px; font-weight: 700; }
.forbidden-card p { color: #6c6f8a; margin-bottom: 0; }
</style>
</head>
<body>
<div class="forbidden-card">
  <i class="bi bi-shield-lock"></i>
  <h4>접근이 제한되었습니다</h4>
  <p>사내 네트워크(공인 IP)에서만 접근할 수 있는 시스템입니다.<br>사내망 연결 상태를 확인해 주세요.</p>
</div>
</body>
</html>
