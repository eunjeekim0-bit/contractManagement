{% extends "base.html" %}
{% block title %}계약서마스터 · 계약서 관리{% endblock %}
{% block page_title %}<i class="bi bi-table me-2 text-primary"></i>계약서마스터{% endblock %}

{% block extra_style %}
<style>
.search-card { border-radius: 14px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.form-label { font-weight: 600; font-size: .85rem; color: #444; }
.search-card .form-label { font-size: .78rem; margin-bottom: .2rem; }
.search-card .form-control, .search-card .form-select, .search-card .btn { font-size: .82rem; padding: .3rem .6rem; }
.advanced-toggle-btn { font-size: .8rem; font-weight: 600; color: var(--primary); background: none; border: none; padding: 4px 8px; }
.advanced-toggle-btn:hover { text-decoration: underline; }
.advanced-toggle-btn .chevron { transition: transform .18s ease; display: inline-block; }
.advanced-toggle-btn[aria-expanded="true"] .chevron { transform: rotate(180deg); }

.master-card { border-radius: 16px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
table.master-table { font-size: .88rem; }
table.master-table thead th { background: #e8eaff; color: #2b2d6e; white-space: nowrap; text-align: center; }
.master-table td { vertical-align: middle; }
.empty-state { text-align:center; padding: 60px 0; color:#999; }

.sealed-badge { font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; cursor: pointer; border: none; }
.sealed-badge.sealed-y { background:#d8f8ee; color:#06a075; }
.sealed-badge.sealed-n { background:#f0f0f0; color:#888; }
</style>
{% endblock %}

{% block content %}

  <!-- Search -->
  <div class="card search-card p-2 mb-3">
    <div class="row g-2">
      <div class="col-md-3 col-sm-6">
        <label class="form-label">연구과제</label>
        <select class="form-select" id="q-research-project">
          <option value="">전체</option>
        </select>
      </div>
      <div class="col-md-3 col-sm-6">
        <label class="form-label">파트너사</label>
        <input type="text" class="form-control" id="q-partner" placeholder="파트너사명 일부 입력">
      </div>
      <div class="col-md-3 col-sm-6">
        <label class="form-label">계약명</label>
        <input type="text" class="form-control" id="q-name" placeholder="계약명 일부 입력">
      </div>
      <div class="col-md-3 col-sm-6">
        <label class="form-label">부서</label>
        <input type="text" class="form-control" id="q-dept" placeholder="부서명 입력">
      </div>

      <div class="col-12">
        <button class="advanced-toggle-btn" type="button" data-bs-toggle="collapse" data-bs-target="#advancedSearch" aria-expanded="false" aria-controls="advancedSearch" id="advancedToggleBtn">
          상세 검색 조건 <i class="bi bi-chevron-down chevron"></i>
        </button>
      </div>

      <div class="collapse col-12" id="advancedSearch">
        <div class="row g-2">
          <div class="col-md-3 col-sm-6">
            <label class="form-label">기안자</label>
            <input type="text" class="form-control" id="q-drafter" placeholder="이름 입력">
          </div>
          <div class="col-md-4 col-sm-6">
            <label class="form-label">계약기간</label>
            <div class="d-flex align-items-center gap-2">
              <input type="date" class="form-control" id="q-start">
              <span class="text-muted">~</span>
              <input type="date" class="form-control" id="q-end">
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 d-flex justify-content-end gap-2 mt-2">
        <button class="btn btn-outline-secondary btn-sm" onclick="resetSearch()"><i class="bi bi-arrow-counterclockwise me-1"></i>초기화</button>
        <button class="btn btn-primary btn-sm px-3" onclick="runSearch()"><i class="bi bi-search me-1"></i>검색</button>
      </div>
    </div>
  </div>

  <div class="card master-card">
    <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
      <span><i class="bi bi-list-ul me-2 text-primary"></i>전체 계약서 <span class="badge bg-secondary" id="resultCount">0</span></span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-bordered master-table mb-0">
          <thead>
            <tr>
              <th>연구과제</th>
              <th>파트너사</th>
              <th style="min-width:220px">계약명</th>
              <th>계약기간</th>
              <th>양사 체결여부</th>
              <th>부서</th>
              <th>기안자</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" style="display:none">
        <i class="bi bi-inbox" style="font-size:2.5rem"></i>
        <div class="mt-2">조회된 계약서가 없습니다</div>
      </div>
    </div>
  </div>

{% endblock %}

{% block extra_script %}
<script>
function resetSearch() {
  ['q-partner','q-name','q-dept','q-drafter','q-start','q-end','q-research-project'].forEach(id => document.getElementById(id).value = '');
  runSearch();
}

async function runSearch() {
  const params = new URLSearchParams({
    partner: document.getElementById('q-partner').value.trim(),
    name: document.getElementById('q-name').value.trim(),
    dept: document.getElementById('q-dept').value.trim(),
    drafter: document.getElementById('q-drafter').value.trim(),
    start: document.getElementById('q-start').value,
    end: document.getElementById('q-end').value,
    research_project: document.getElementById('q-research-project').value,
  });
  const res = await fetch('/api/contracts/search?' + params.toString());
  const data = await res.json();
  renderResults(data.results);
}

async function loadResearchProjects() {
  const res = await fetch('/api/research-projects');
  const projects = await res.json();
  const select = document.getElementById('q-research-project');
  projects.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    select.appendChild(opt);
  });
}

function formatPeriod(r) {
  if (r.end_date === '2099-12-31') return '<span class="text-muted fst-italic">별도 조건에 따름</span>';
  return `${r.start_date} ~ ${r.end_date}`;
}

let currentResults = [];

function renderResults(results) {
  currentResults = results;
  document.getElementById('resultCount').textContent = results.length;
  document.getElementById('emptyState').style.display = results.length ? 'none' : '';

  const tbody = document.getElementById('resultBody');
  tbody.innerHTML = results.map(r => `
    <tr>
      <td>${r.research_project || ''}</td>
      <td>${r.partner}</td>
      <td>${r.contract_name}</td>
      <td>${formatPeriod(r)}</td>
      <td class="text-center">
        <button type="button" class="badge sealed-badge ${r.sealed ? 'sealed-y' : 'sealed-n'}" title="클릭하여 변경" onclick="toggleSealed('${r.id}')">${r.sealed ? 'Y' : 'N'}</button>
      </td>
      <td>${r.dept_name}</td>
      <td>${r.drafter_name}</td>
    </tr>
  `).join('');
}

async function toggleSealed(id) {
  const row = currentResults.find(r => r.id === id);
  if (!row) return;
  const res = await fetch(`/api/contracts/${id}/sealed`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sealed: !row.sealed }),
  });
  if (!res.ok) { alert('저장에 실패했습니다.'); return; }
  const updated = await res.json();
  row.sealed = updated.sealed;
  renderResults(currentResults);
}

loadResearchProjects();
runSearch();
</script>
{% endblock %}
