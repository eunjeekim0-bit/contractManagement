<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>계약서 관리 — 모크업 (Index)</title>
  <link rel="stylesheet" href="../../static/css/mockup.css">
</head>
<body>
  <header class="mk-header">
    <h1>계약서 관리</h1>
    <div class="mk-search">
      <input placeholder="계약서 검색, 예: 고객명, 계약번호">
      <button>검색</button>
    </div>
  </header>

  <main class="mk-container">
    <aside class="mk-sidebar">
      <nav>
        <a class="active">대시보드</a>
        <a>계약서 목록</a>
        <a>의무사항</a>
        <a>접근 권한</a>
      </nav>
    </aside>

    <section class="mk-content">
      <h2>최근 계약서</h2>
      <div class="mk-cards">
        <div class="mk-card">
          <h3>계약서 A</h3>
          <p>클라이언트: 주식회사 예시</p>
          <p>만료: 2026-11-12</p>
          <div class="mk-actions">
            <button>상세</button>
            <button class="primary">의무 보기</button>
          </div>
        </div>
        <div class="mk-card">
          <h3>계약서 B</h3>
          <p>클라이언트: 주식회사 샘플</p>
          <p>만료: 2027-03-01</p>
          <div class="mk-actions">
            <button>상세</button>
            <button class="primary">의무 보기</button>
          </div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
