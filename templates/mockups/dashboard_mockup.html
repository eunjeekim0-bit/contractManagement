<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>계약서 관리 — 모크업 (Dashboard)</title>
  <link rel="stylesheet" href="../../static/css/mockup.css">
</head>
<body>
  <header class="mk-header"><h1>대시보드</h1></header>
  <main class="mk-container">
    <aside class="mk-sidebar">
      <nav>
        <a>대시보드</a>
        <a class="active">계약서 목록</a>
      </nav>
    </aside>
    <section class="mk-content">
      <div class="mk-stats">
        <div class="stat">총 계약서<br><strong>128</strong></div>
        <div class="stat">만료 임박<br><strong>6</strong></div>
        <div class="stat">미완료 의무<br><strong>24</strong></div>
      </div>

      <h3>최근 활동</h3>
      <div class="mk-table-wrap">
        <table class="mk-table">
          <thead><tr><th>계약서</th><th>클라이언트</th><th>상태</th><th>만료일</th></tr></thead>
          <tbody>
            <tr><td>계약서 A</td><td>주식회사 예시</td><td>유효</td><td>2026-11-12</td></tr>
            <tr><td>계약서 B</td><td>주식회사 샘플</td><td>검토중</td><td>2027-03-01</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
